name: Build AnalogPro Camera APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release & Debug APK
        run: |
          if [ -f "AnalogProCamera/build.gradle.kts" ]; then
            cd AnalogProCamera
          fi
          gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK (Ready to Install)
        uses: actions/upload-artifact@v4
        with:
          name: AnalogPro-Camera-Release-APK
          path: "**/app/build/outputs/apk/release/app-release.apk"
